architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";


repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    // There is no Forgified Fabric API on the 1.20.1 line: common/ must stay Fabric-API-free.
    // Fabric-API-shaped call sites live behind the platform seams instead.
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
    // Ecosystem libraries: all resolved from the Modrinth maven. Modrinth serves only the per-loader
    // jars, so `common` keeps compiling against the `-fabric` flavour (this module's dummy platform).
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}") { transitive = false }
    /// Compat
    modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}") { transitive = false }
    modCompileOnly("maven.modrinth:critical-strike:${project.critical_strike_version}-${platform}") { transitive = false }
}

loom {
    accessWidenerPath = file("src/main/resources/more-rpg-classes.accesswidener")
}