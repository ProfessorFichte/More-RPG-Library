plugins {
    id 'com.gradleup.shadow'
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id "com.github.breadmoirai.github-release" version "2.4.1"
    id "com.modrinth.minotaur" version "2.+"
}

def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }

    def content = changelogFile.text
    def sections = content.split(/(?m)(?=^# )/)

    // Return the first section (most recent) after the split
    // Remove the first empty element if it exists
    def recentSection = sections.find { it.trim().startsWith('#') }
    return recentSection ?: "No changelog available"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = "more_rpg_classes"
        outputDirectory = project(':common').file('src/main/generated')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ftb.dev/releases"
            }
        }
        filter {
            includeGroup"dev.latvian.mods"
            includeGroup"dev.ftb.mods"
        }
    }
    // JEI Maven currently required by FTB
    maven {
        name "ModMaven (JEI)"
        url "https://modmaven.dev/"
        content {
            includeGroup "mezz.jei"
        }
    }

    // Accessories
    maven { url 'https://maven.wispforest.io/releases' }

    mavenLocal()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${project.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")

    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand(project.properties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Publishing configuration
def release_type = project.hasProperty('release_type') ? project.property('release_type') : 'release'

tasks.register('publishMod') {
    group = 'publishing'
    description = 'Publishes the mod to CurseForge, Modrinth, and GitHub'
    dependsOn(tasks.remapJar)
    finalizedBy(tasks.curseforge)
    finalizedBy(tasks.modrinth)
    finalizedBy(tasks.githubRelease)
}

if (System.getenv("CURSEFORGE_API_KEY")) {
    curseforge {
        apiKey = System.getenv("CURSEFORGE_API_KEY")
        project {
            id = System.getenv("CURSEFORGE_PROJECT_ID")
            changelog = changelog_last_section()
            changelogType = 'markdown'
            releaseType = release_type
            addGameVersion "${project.minecraft_version}"
            addGameVersion "${project.minecraft_compat_version}"
            addGameVersion "Fabric"

            relations {
                // Required dependencies
                requiredDependency 'spell-engine'
                requiredDependency 'more-rpg-library'
                requiredDependency 'archers'

                // Optional dependencies
                optionalDependency 'lne-archers'
            }

            mainArtifact(remapJar)
            afterEvaluate {
                uploadTask.dependsOn(remapJar)
            }
        }
    }
}

if (System.getenv("MODRINTH_API_KEY")) {
    modrinth {
        token = System.getenv("MODRINTH_API_KEY")
        projectId = System.getenv("MODRINTH_PROJECT_ID")
        versionName = "${version}-${platform}"
        versionNumber = "${version}-${platform}"
        versionType = release_type
        uploadFile = remapJar
        gameVersions = ["${project.minecraft_version}"]
        loaders = ["fabric"]
        changelog = changelog_last_section()
        dependencies {
            // Required dependencies
            required.project 'spell-engine'
            required.project 'spell-power'
        }
    }
}

if (System.getenv("GH_API_KEY")) {
    githubRelease {
        token System.getenv("GH_API_KEY")
        owner System.getenv("GH_OWNER")
        repo System.getenv("GH_REPO")
        tagName "${version}"
        targetCommitish System.getenv("GH_BRANCH")
        releaseName "Release"
        generateReleaseNotes false
        body changelog_last_section()
        draft false
        prerelease false
        releaseAssets remapJar.archiveFile
    }
}

if (System.getenv("CURSEFORGE_API_KEY")) {
    tasks.curseforge.dependsOn remapJar
}
if (System.getenv("MODRINTH_API_KEY")) {
    tasks.modrinth.dependsOn remapJar
}
if (System.getenv("GH_API_KEY")) {
    tasks.githubRelease.dependsOn remapJar
}
