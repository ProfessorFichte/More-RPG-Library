plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}

def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }

    def content = changelogFile.text
    def sections = content.split(/(?m)(?=^# )/)

    // Return the first section (most recent) after the split
    // Remove the first empty element if it exists
    def recentSection = sections.find { it.trim().startsWith('#') }
    return recentSection ?: "No changelog available"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = "mrpg_lib"
        outputDirectory = project(':common').file('src/main/generated')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    mavenLocal()
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ftb.dev/releases"
            }
        }
        filter {
            includeGroup"dev.latvian.mods"
            includeGroup"dev.ftb.mods"
        }
    }
    // JEI Maven currently required by FTB
    maven {
        name "ModMaven (JEI)"
        url "https://modmaven.dev/"
        content {
            includeGroup "mezz.jei"
        }
    }

    // Accessories
    maven { url 'https://maven.wispforest.io/releases' }
}

if (rootProject.ext.contentWorkspaceAny) {
    apply from: rootProject.file("workspace-runtime.gradle")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modCompileOnly("dev.kosmx.player-anim:player-animation-lib-${platform}:${project.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")

    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")
    modCompileOnly("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    modCompileOnly("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    modCompileOnly("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
    modCompileOnly("maven.modrinth:better-combat:${project.better_combat_version}-${platform}")
    modCompileOnly("maven.modrinth:combat-roll:${project.combat_roll_version}-${platform}")
    modCompileOnly("maven.modrinth:runes:${project.runes_version}-${platform}")
    if (!project.hasProperty("noCompat")) {
        modLocalRuntime("dev.kosmx.player-anim:player-animation-lib-${platform}:${project.player_anim_version}")
        modLocalRuntime("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
        if (!project.hasProperty("noRunes")) {
            modLocalRuntime("maven.modrinth:runes:${project.runes_version}-${platform}")
        }
        if (!project.hasProperty("spOnly")) {
            modLocalRuntime("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
            modLocalRuntime("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
        }
    }
}

processResources {
    inputs.property 'version', project.version
    exclude '.cache/**'

    filesMatching("fabric.mod.json") {
        expand(project.properties)
    }
}

def generatedDir = project(':common').file('src/main/generated')
def commonResources = project(':common').file('src/main/resources')
def datagenSnapshot = layout.buildDirectory.file('datagen/generated.snapshot')
def allowedHandWrittenData = ['wizards/item/wizard_runes.json']
def datagenOwnedAssets = ['lang/en_us.json', 'models/item', 'particles']

def generatedManifest = {
    def root = generatedDir.toPath()
    def lines = []
    if (generatedDir.exists()) {
        generatedDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def rel = root.relativize(f.toPath()).toString().replace(File.separator, '/')
            if (!rel.startsWith('.cache/')) {
                lines << (rel + ' ' + java.security.MessageDigest.getInstance('MD5').digest(f.bytes).encodeHex())
            }
        }
    }
    lines.sort()
}

tasks.register('snapshotGenerated') {
    doLast {
        def target = datagenSnapshot.get().asFile
        target.parentFile.mkdirs()
        target.text = generatedManifest().join(System.lineSeparator())
    }
}

tasks.register('verifyDatagen') {
    dependsOn 'snapshotGenerated', 'runDatagen'
    doLast {
        def problems = []
        def before = datagenSnapshot.get().asFile.text.readLines() as Set
        def after = generatedManifest() as Set
        (before + after).findAll { !(before.contains(it) && after.contains(it)) }.each {
            problems << ((after.contains(it) ? 'generated differs from committed output: ' : 'stale generated file: ') + it.split(' ')[0])
        }
        def dataDir = new File(commonResources, 'data')
        if (dataDir.exists()) {
            dataDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def rel = dataDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                if (!allowedHandWrittenData.contains(rel)) {
                    problems << 'hand-written data file: data/' + rel
                }
            }
        }
        def assetsDir = new File(commonResources, 'assets/mrpg_lib')
        datagenOwnedAssets.each { path ->
            def target = new File(assetsDir, path)
            if (target.isFile() || (target.isDirectory() && target.list().length > 0)) {
                problems << 'hand-written file for datagen-owned asset: assets/mrpg_lib/' + path
            }
        }
        if (problems) {
            throw new GradleException('verifyDatagen failed:' + System.lineSeparator() + problems.unique().join(System.lineSeparator()))
        }
        println 'verifyDatagen: OK'
    }
}

tasks.named('runDatagen') {
    mustRunAfter 'snapshotGenerated'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Publishing configuration
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.provider { changelog_last_section() }
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"
    displayName = "${project.version}-${platform}"
    modLoaders.add("fabric")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = true
        changelogType = "markdown"
        optional("spell-engine", "spell-power", "playeranimator", "better-combat", "combat-roll")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        optional { slug = "spell-engine" }
        optional { slug = "spell-power" }
        optional { slug = "playeranimator" }
        optional { slug = "better-combat" }
        optional { slug = "combat-roll" }
    }

    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
