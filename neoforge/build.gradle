plugins {
    id 'com.gradleup.shadow'
    id "net.darkhax.curseforgegradle" version "1.1.28"
    id "com.modrinth.minotaur" version "2.+"
}


def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }

    def content = changelogFile.text
    def sections = content.split(/(?m)(?=^# )/)

    // Return the first section (most recent) after the split
    // Remove the first empty element if it exists
    def recentSection = sections.find { it.trim().startsWith('#') }
    return recentSection ?: "No changelog available"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}


def generatedResources = project(':common').file('src/main/generated')
sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ftb.dev/releases"
            }
        }
        filter {
            includeGroup"dev.latvian.mods"
            includeGroup"dev.ftb.mods"
        }
    }
    // JEI Maven currently required by FTB
    maven {
        name "ModMaven (JEI)"
        url "https://modmaven.dev/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        url "https://maven.su5ed.dev/releases"
    }

    // For Accessories
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    modImplementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.forgified_fabric_api_version}"

    modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${project.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")

    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")


    // NeoForge specific
    // - Accessories - https://docs.wispforest.io/accessories/developer/dev_setup
    modImplementation "maven.modrinth:owo-lib:${project.owo_neo_version}" // AccessoryItem wouldn't compile without this
    modImplementation("io.wispforest:accessories-neoforge:${project.accessories_version}")
    forgeRuntimeLibrary("blue.endless:jankson:1.2.2")
    forgeRuntimeLibrary("io.wispforest:endec:0.1.5.1")
    forgeRuntimeLibrary("io.wispforest.endec:gson:0.1.3.1")
    forgeRuntimeLibrary("io.wispforest.endec:jankson:0.1.3.1")
    forgeRuntimeLibrary("io.wispforest.endec:netty:0.1.2")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        def cleanedProps = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        expand(cleanedProps)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Publishing configuration
def release_type = project.hasProperty('release_type') ? project.property('release_type') : 'release'

if (System.getenv("CURSEFORGE_API_KEY")) {
    tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        apiToken = System.getenv("CURSEFORGE_API_KEY")

        def mainFile = upload(System.getenv("CURSEFORGE_PROJECT_ID"), remapJar)
        mainFile.changelog = changelog_last_section()
        mainFile.changelogType = 'markdown'
        mainFile.releaseType = release_type
        mainFile.addGameVersion("${project.minecraft_version}")
        mainFile.addModLoader("NeoForge")
        mainFile.addEnvironment("Client")
        mainFile.addEnvironment("Server")

        // Required dependencies
        mainFile.addRequirement('spell-engine')
        mainFile.addRequirement('spell-power')
    }
    tasks.curseforge.dependsOn remapJar
}

if (System.getenv("MODRINTH_API_KEY")) {
    modrinth {
        token = System.getenv("MODRINTH_API_KEY")
        projectId = System.getenv("MODRINTH_PROJECT_ID")
        versionName = "${version}-${platform}"
        versionNumber = "${version}-${platform}"
        versionType = release_type
        uploadFile = remapJar
        gameVersions = ["${project.minecraft_version}"]
        loaders = ["neoforge"]
        changelog = changelog_last_section()
        dependencies {
            // Required dependencies
            required.project 'spell-engine'
            required.project 'spell-power'
        }
    }
    tasks.modrinth.dependsOn remapJar
}

tasks.register('publishMod') {
    group = 'publishing'
    description = 'Publishes the mod to CurseForge and Modrinth'
    dependsOn(tasks.remapJar)
    if (System.getenv("CURSEFORGE_API_KEY")) {
        finalizedBy(tasks.curseforge)
    }
    if (System.getenv("MODRINTH_API_KEY")) {
        finalizedBy(tasks.modrinth)
    }
}