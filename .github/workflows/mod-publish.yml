name: Mod Publish (shared)

# Called by the Publish workflow of every mod repo. The mod repo is checked out as the workspace,
# the release helper script comes from More RPG Library (tools_ref).
on:
  workflow_call:
    inputs:
      fabric: { type: boolean, default: true }
      neoforge: { type: boolean, default: true }
      release_type: { type: string, default: release }
      curseforge: { type: boolean, default: true }
      modrinth: { type: boolean, default: true }
      github: { type: boolean, default: true }
      sync_description: { type: boolean, default: false }
      announce_discord: { type: boolean, default: true }
      changelog: { type: string, default: '' }
      curseforge_project_id: { type: string, default: '' }
      modrinth_project_id: { type: string, default: '' }
      discord_role_id: { type: string, default: '' }
      discord_icon_url: { type: string, default: '' }
      discord_image_url: { type: string, default: '' }
      discord_emoji_modrinth: { type: string, default: '' }
      discord_emoji_curseforge: { type: string, default: '' }
      discord_emoji_github: { type: string, default: '' }
      discord_emoji_kofi: { type: string, default: '' }
      java_version: { type: string, default: '21' }
      tools_ref: { type: string, default: '1.21.1' }
    secrets:
      CURSEFORGE_API_KEY: { required: false }
      MODRINTH_API_KEY: { required: false }
      GH_API_KEY: { required: false }
      DISCORD_WEBHOOK: { required: false }

permissions:
  contents: read

env:
  TOOLS: .mod-tools/.github/scripts/mod_release.py

jobs:
  # Separate job because an empty matrix would silently run zero jobs.
  plan:
    runs-on: ubuntu-latest
    outputs:
      loaders: ${{ steps.plan.outputs.loaders }}
      destinations: ${{ steps.plan.outputs.destinations }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Resolve build plan
        id: plan
        # `if` blocks, not `&&` chains: `${{ inputs.x }}` is a bare `false`, which aborts under `set -e`.
        run: |
          set -euo pipefail

          loaders=""
          if [ "${{ inputs.fabric }}"   = "true" ]; then loaders="$loaders fabric";   fi
          if [ "${{ inputs.neoforge }}" = "true" ]; then loaders="$loaders neoforge"; fi

          destinations=""
          if [ "${{ inputs.curseforge }}" = "true" ]; then destinations="$destinations publishCurseforge"; fi
          if [ "${{ inputs.modrinth }}"   = "true" ]; then destinations="$destinations publishModrinth";   fi
          if [ "${{ inputs.github }}"     = "true" ]; then destinations="$destinations publishGithub";     fi

          loaders="${loaders# }"
          destinations="${destinations# }"

          # No loader ticked = nothing is built or uploaded, only the ticked follow-up steps run (e.g. a Discord test).
          if [ -z "$loaders" ]; then
            followups=""
            if [ "${{ inputs.announce_discord }}" = "true" ]; then followups="$followups Discord"; fi
            if [ "${{ inputs.modrinth }}" = "true" ] && [ "${{ inputs.sync_description }}" = "true" ]; then followups="$followups Modrinth-description"; fi
            if [ -z "$followups" ]; then
              echo "::error::Nothing to do - tick a loader (Fabric / NeoForge) to publish, or only Discord / Modrinth description to run those alone."
              exit 1
            fi
            echo "loaders=[]" >> "$GITHUB_OUTPUT"
            echo "destinations=$destinations" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No loader selected - nothing is built or uploaded, only:$followups"
            exit 0
          fi
          if [ -z "$destinations" ]; then
            echo "::error::No platform selected - tick at least one of CurseForge / Modrinth / GitHub Release."
            exit 1
          fi

          json=""
          for l in $loaders; do json="$json${json:+,}\"$l\""; done

          echo "loaders=[$json]" >> "$GITHUB_OUTPUT"
          echo "destinations=$destinations" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "Loaders: $loaders | Platforms: $destinations | Release: ${{ inputs.release_type }}"
      - uses: actions/checkout@v4
        if: ${{ inputs.modrinth && inputs.sync_description }}
      - uses: actions/checkout@v4
        if: ${{ inputs.modrinth && inputs.sync_description }}
        with:
          repository: ProfessorFichte/More-RPG-Library
          ref: ${{ inputs.tools_ref }}
          path: .mod-tools
          sparse-checkout: .github/scripts
      - name: Check README.md for Modrinth before uploading anything
        if: ${{ inputs.modrinth && inputs.sync_description }}
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 "$TOOLS" modrinth-description --check

  build:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # never cancel a sibling mid-upload
      matrix:
        loader: ${{ fromJSON(needs.plan.outputs.build == 'true' && needs.plan.outputs.loaders || '["none"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProfessorFichte/More-RPG-Library
          ref: ${{ inputs.tools_ref }}
          path: .mod-tools
          sparse-checkout: .github/scripts
      - name: Read the newest CHANGELOG.md section
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          delimiter="CHANGELOG_$(date +%s%N)"
          { echo "MOD_CHANGELOG<<$delimiter"; python3 "$TOOLS" changelog; echo "$delimiter"; } >> "$GITHUB_ENV"
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'
      - name: Resolve Gradle tasks
        id: targets
        # `build` is explicit: the publish tasks depend on remapJar, not on build/check.
        run: |
          set -euo pipefail
          tasks=":${{ matrix.loader }}:build"
          for d in ${{ needs.plan.outputs.destinations }}; do
            tasks="$tasks :${{ matrix.loader }}:$d"
          done
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.loader }} via: $tasks"
      - name: Build with Gradle
        uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
        with:
          arguments: ${{ steps.targets.outputs.tasks }} -Prelease_type=${{ inputs.release_type }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge_project_id }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT_RAW_ID: ${{ inputs.modrinth_project_id }}
          MODRINTH_PROJECT_ID: ${{ inputs.modrinth_project_id }}
          GH_API_KEY: ${{ secrets.GH_API_KEY }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}

  # !cancelled() + the result checks: still runs when build was skipped on purpose (no loader ticked), never after a failed build.
  modrinth-description:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) && inputs.modrinth && inputs.sync_description }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProfessorFichte/More-RPG-Library
          ref: ${{ inputs.tools_ref }}
          path: .mod-tools
          sparse-checkout: .github/scripts
      - name: Upload README.md as the Modrinth description
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          MR_ID: ${{ inputs.modrinth_project_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 "$TOOLS" modrinth-description

  # Runs once, after all matrix builds succeeded -> one message instead of one per loader and platform.
  announce-discord:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) && inputs.announce_discord }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProfessorFichte/More-RPG-Library
          ref: ${{ inputs.tools_ref }}
          path: .mod-tools
          sparse-checkout: .github/scripts
      - name: Send Discord announcement
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ inputs.discord_role_id }}
          ICON_URL: ${{ inputs.discord_icon_url }}
          IMAGE_URL: ${{ inputs.discord_image_url }}
          EMOJI_MODRINTH: ${{ inputs.discord_emoji_modrinth }}
          EMOJI_CURSEFORGE: ${{ inputs.discord_emoji_curseforge }}
          EMOJI_GITHUB: ${{ inputs.discord_emoji_github }}
          EMOJI_KOFI: ${{ inputs.discord_emoji_kofi }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          LOADERS_JSON: ${{ needs.plan.outputs.loaders }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          TO_CURSEFORGE: ${{ inputs.curseforge }}
          TO_MODRINTH: ${{ inputs.modrinth }}
          TO_GITHUB: ${{ inputs.github }}
          CF_ID: ${{ inputs.curseforge_project_id }}
          MR_ID: ${{ inputs.modrinth_project_id }}
          CHANGELOG: ${{ inputs.changelog }}
        run: python3 "$TOOLS" discord
