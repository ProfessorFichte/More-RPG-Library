plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}


def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }

    def content = changelogFile.text
    def sections = content.split(/(?m)(?=^# )/)

    // Return the first section (most recent) after the split
    // Remove the first empty element if it exists
    def recentSection = sections.find { it.trim().startsWith('#') }
    return recentSection ?: "No changelog available"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        mixinConfig "more-rpg-classes.mixins.json"
        mixinConfig "more-rpg-classes-forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}


def generatedResources = project(':common').file('src/main/generated')
sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }
    // Curios (Forge accessory slots)
    maven { url 'https://maven.theillusivec4.top/' }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")

    // Ecosystem libraries: all resolved from the Modrinth maven.
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}") { transitive = false }

    // Forge 47 does not bundle MixinExtras (Fabric Loader does) - SpellEngine's mixins need it at runtime.
    localRuntime("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}")
    // SpellEngine's accessory integration on Forge.
    modLocalRuntime("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}") { transitive = false }
    // Spell Engine hard-depends on the player animation library at runtime.
    modLocalRuntime("dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}")
    // Soft dependency, dev runtime only: without it the `runes:crafting` recipes cannot be parsed.
    modLocalRuntime("maven.modrinth:runes:${rootProject.runes_version}-forge") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        // Forge rejects '+<mc>' build metadata inside a version range.
        expand version: inputs.properties.version.toString().split('\\+')[0]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Publishing configuration
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.provider { changelog_last_section() }
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"
    displayName = "${project.version}-${platform}"
    // NeoForge 1.20.1 is a fork of Forge 47.1 that kept the Forge packages and FML,
    // so the same jar loads there; both loaders are tagged.
    modLoaders.add("forge")
    modLoaders.add("neoforge")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = true
        changelogType = "markdown"
        requires("spell-engine", "spell-power")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        requires { slug = "spell-engine" }
        requires { slug = "spell-power" }
    }

    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
